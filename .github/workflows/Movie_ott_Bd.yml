name: Movie OTT BD Auto Update

on:
  workflow_dispatch:

  schedule:
    # Every hour at minute 32 (UTC)
    - cron: "32 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      MOVIE_OTT_BD_ZIP_PASS: ${{ secrets.MOVIE_OTT_BD_ZIP_PASS }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Project Files
        run: |
          test -f Movie_ott_Bd.py
          test -f requirements.txt
          echo "Project files found."

      - name: Check ZIP Password Secret
        run: |
          if [ -z "$MOVIE_OTT_BD_ZIP_PASS" ]; then
            echo "ERROR: MOVIE_OTT_BD_ZIP_PASS secret is missing."
            exit 1
          fi

      - name: Run Movie OTT BD
        run: |
          python Movie_ott_Bd.py

      - name: Verify Output Files
        run: |
          test -s output/Movie_ott_Bd.m3u8
          test -s Movie_ott_Bd.zip
          echo "Playlist and encrypted ZIP verified."

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/Movie_ott_Bd.m3u8 Movie_ott_Bd.zip

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update Movie OTT BD playlist"
            git push
          fi
