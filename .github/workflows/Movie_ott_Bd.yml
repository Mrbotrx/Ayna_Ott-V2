name: MOVIE OTT BD AUTO UPDATE

on:
workflow_dispatch:

schedule:
- cron: '32 * * * *'

push:
paths:
- 'Movie_ott_Bd.zip'
- 'requirements.txt'
- '.github/workflows/Movie_ott_Bd.yml'

permissions:
contents: write

concurrency:
group: movie-ott-bd
cancel-in-progress: false

jobs:
build:
name: Generate IPTV Playlist
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Setup Python 3.12
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pyzipper

  - name: Check Repository
    run: |
      echo "Searching repository..."
      find . -maxdepth 3 -type f | sort

      if [ ! -f Movie_ott_Bd.zip ]; then
        echo "ERROR: Movie_ott_Bd.zip NOT FOUND!"
        exit 1
      fi

  - name: Extract Python Source
    env:
      ZIP_PASSWORD: ${{ secrets.MOVIE_OTT_BD_ZIP_PASS }}
    run: |
      python - <<'PY'
      import os
      import pyzipper

      archive = "Movie_ott_Bd.zip"
      output = "Movie_ott_Bd.py"
      password = os.environ.get("ZIP_PASSWORD", "")

      print("Searching encrypted ZIP...")

      with pyzipper.AESZipFile(archive, "r") as z:
          files = z.namelist()

          for name in files:
              print("ZIP:", name)

          matches = [
              name for name in files
              if os.path.basename(name).lower() == output.lower()
          ]

          if len(matches) != 1:
              raise FileNotFoundError(
                  "Expected exactly one Movie_ott_Bd.py in ZIP"
              )

          z.pwd = password.encode() if password else None

          try:
              data = z.read(matches[0])
          except Exception as e:
              raise RuntimeError(
                  "ZIP extraction failed. Check password and ZIP format."
              ) from e

      if not data:
          raise RuntimeError("Python source is empty!")

      with open(output, "wb") as f:
          f.write(data)

      print("Extraction successful!")

      PY

  - name: Validate Python
    run: |
      python -m py_compile Movie_ott_Bd.py
      echo "Python syntax OK"

  - name: Run Playlist Generator
    run: |
      python -u Movie_ott_Bd.py

  - name: Verify Playlist
    run: |
      if [ ! -d Playlist ]; then
        echo "ERROR: Playlist folder missing!"
        exit 1
      fi

      find Playlist -type f -print

      if [ -z "$(find Playlist -type f -print -quit)" ]; then
        echo "ERROR: No playlist generated!"
        exit 1
      fi

      echo "Playlist validation successful!"

  - name: Commit Playlist Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add Playlist/

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Auto Update Movie OTT BD Playlist"
        git push
      fi

  - name: Cleanup
    if: always()
    run: |
      rm -f Movie_ott_Bd.py
      echo "Cleanup completed."

  - name: Workflow Summary
    if: always()
    run: |
      echo "## MOVIE OTT BD" >> "$GITHUB_STEP_SUMMARY"
      echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      echo "Schedule: Every hour at minute 32" >> "$GITHUB_STEP_SUMMARY"
      echo "Python: 3.12" >> "$GITHUB_STEP_SUMMARY"
