name: Movie_ott_Bd Auto Update

on:
  workflow_dispatch:

  schedule:
    - cron: "32 * * * *"

permissions:
  contents: write

concurrency:
  group: Movie_ott_Bd
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Main Script From ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import pyzipper

          archive = "Movie_ott_Bd.zip"
          password = os.environ.get("ZIP_PASSWORD")

          if not os.path.isfile(archive):
              raise SystemExit("ERROR: Movie_ott_Bd.zip not found!")

          if not password:
              raise SystemExit("ERROR: ZIP_PASSWORD secret missing!")

          with pyzipper.AESZipFile(archive, "r") as z:
              z.setpassword(password.encode("utf-8"))

              names = z.namelist()
              print("ZIP FILES:", names)

              matches = [
                  name for name in names
                  if os.path.basename(name) == "Movie_ott_Bd.py"
              ]

              if not matches:
                  raise SystemExit(
                      "ERROR: Movie_ott_Bd.py not found inside ZIP!"
                  )

              with z.open(matches[0]) as source:
                  with open("Movie_ott_Bd.py", "wb") as target:
                      target.write(source.read())

          print("Main script extracted successfully!")
          PY

      - name: Run Movie Generator
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python Movie_ott_Bd.py

      - name: Verify Output
        run: |
          test -s output/Movie_ott_Bd.m3u8
          test -s Movie_ott_Bd.zip
          echo "Playlist and ZIP successfully generated!"

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/Movie_ott_Bd.m3u8
          git add Movie_ott_Bd.zip

          git diff --cached --quiet || git commit -m "Update Movie OTT BD"

          git push
