name: MOVIE OTT BD - ADVANCED AUTO UPDATE

on:
workflow_dispatch:

schedule:
- cron: "32 * * * *"

push:
paths:
- 'Movie_ott_Bd.zip'
- 'requirements.txt'
- '.github/workflows/movie_ott_bd.yml'

permissions:
contents: write

concurrency:
group: movie-ott-bd-update
cancel-in-progress: false

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 1

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'
      cache: 'pip'
      cache-dependency-path: requirements.txt

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Verify Repository
    run: |
      echo "========== ROOT FILES =========="
      find . -maxdepth 2 -type f | sort

      test -f Movie_ott_Bd.zip || {
        echo "ERROR: ZIP FILE NOT FOUND"
        exit 1
      }

  - name: Extract Encrypted Python Source
    env:
      ZIP_PASSWORD: ${{ secrets.MOVIE_OTT_BD_ZIP_PASS }}
    run: |
      python - <<'PY'
      import os
      import zipfile
      import hashlib

      archive = "Movie_ott_Bd.zip"
      output = "Movie_ott_Bd.py"
      password = os.environ.get("ZIP_PASSWORD", "")

      print("Checking ZIP archive...")

      with zipfile.ZipFile(archive, "r") as z:
          bad = z.testzip()

          if bad:
              raise RuntimeError(f"Corrupted ZIP member: {bad}")

          names = z.namelist()

          print("ZIP CONTENTS:")
          for name in names:
              print(" -", name)

          matches = [
              name for name in names
              if os.path.basename(name).lower() == output.lower()
          ]

          if not matches:
              raise FileNotFoundError(
                  "Movie_ott_Bd.py NOT FOUND INSIDE ZIP"
              )

          if len(matches) > 1:
              raise RuntimeError(
                  "Multiple Movie_ott_Bd.py files found in ZIP"
              )

          try:
              data = z.read(
                  matches[0],
                  pwd=password.encode() if password else None
              )
          except RuntimeError as e:
              raise RuntimeError(
                  "Incorrect ZIP password. "
                  "Check MOVIE_OTT_BD_ZIP_PASS."
              ) from e

      if not data:
          raise RuntimeError("Extracted Python file is empty")

      with open(output, "wb") as f:
          f.write(data)

      print("Extraction successful!")
      print("SHA256:", hashlib.sha256(data).hexdigest())
      PY

  - name: Validate Python Source
    run: |
      python -m py_compile Movie_ott_Bd.py
      echo "Python syntax validation successful."

  - name: Run Movie OTT BD Generator
    run: |
      python -u Movie_ott_Bd.py

  - name: Validate Playlist Output
    run: |
      echo "Checking generated playlist..."

      if [ ! -d Playlist ]; then
        echo "Playlist directory not found."
        exit 1
      fi

      find Playlist -type f -maxdepth 3 -print

      COUNT=$(find Playlist -type f | wc -l)

      if [ "$COUNT" -eq 0 ]; then
        echo "ERROR: No playlist generated!"
        exit 1
      fi

      echo "Generated files: $COUNT"

  - name: Commit Updated Playlist
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add Playlist/

      if git diff --cached --quiet; then
        echo "No playlist changes detected."
      else
        git commit -m "Auto Update Movie OTT BD Playlist"
        git push
      fi

  - name: Cleanup Temporary Source
    if: always()
    run: |
      rm -f Movie_ott_Bd.py
      echo "Temporary Python source cleaned."

  - name: Workflow Summary
    if: always()
    run: |
      echo "## MOVIE OTT BD UPDATE" >> $GITHUB_STEP_SUMMARY
      echo "- Workflow: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
      echo "- Python: 3.12" >> $GITHUB_STEP_SUMMARY
      echo "- ZIP extraction: Completed if extraction step passed" >> $GITHUB_STEP_SUMMARY
      echo "- Playlist: Playlist/" >> $GITHUB_STEP_SUMMARY
