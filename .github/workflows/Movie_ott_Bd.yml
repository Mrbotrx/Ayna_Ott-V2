name: Movie OTT BD Auto Update

on:
  workflow_dispatch:

  schedule:
    - cron: "32 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      MOVIE_OTT_BD_ZIP_PASS: ${{ secrets.MOVIE_OTT_BD_ZIP_PASS }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Project Files
        run: |
          test -f Movie_ott_Bd.py
          test -f requirements.txt
          echo "Project files found."

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check ZIP Password
        run: |
          if [ -z "$MOVIE_OTT_BD_ZIP_PASS" ]; then
            echo "ERROR: ZIP password secret missing!"
            exit 1
          fi
          echo "ZIP password detected."

      - name: Run Movie OTT BD
        run: |
          python -u Movie_ott_Bd.py

      - name: Verify Output
        run: |
          test -s output/Movie_ott_Bd.m3u8
          test -s Movie_ott_Bd.zip
          echo "Playlist and ZIP generated."

      - name: Verify AES ZIP
        run: |
          python - <<'PY'
          import os
          import pyzipper

          password = os.environ[
              "MOVIE_OTT_BD_ZIP_PASS"
          ].encode("utf-8")

          with pyzipper.AESZipFile(
              "Movie_ott_Bd.zip", "r"
          ) as zf:

              for name in zf.namelist():
                  zf.read(name, pwd=password)

          print("AES-256 ZIP verified!")
          PY

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/Movie_ott_Bd.m3u8 Movie_ott_Bd.zip

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update Movie OTT BD playlist"
            git push
          fi
