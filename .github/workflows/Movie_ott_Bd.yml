name: MOVIE OTT BD AUTO UPDATE

on:
  workflow_dispatch:

  schedule:
    - cron: "32 * * * *"

  push:
    paths:
      - "Movie_ott_Bd.zip"
      - "requirements.txt"
      - ".github/workflows/Movie_ott_Bd.yml"

permissions:
  contents: write

concurrency:
  group: movie-ott-bd
  cancel-in-progress: false

jobs:
  build:
    name: Build Movie OTT BD
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Repository
        run: |
          ls -la
          test -s Movie_ott_Bd.zip

      - name: Extract Python Source
        env:
          ZIP_PASSWORD: ${{ secrets.MOVIE_OTT_BD_ZIP_PASS }}
        run: |
          python - <<'PY'
          import os
          import pyzipper
          from pathlib import Path

          archive = "Movie_ott_Bd.zip"
          output = "Movie_ott_Bd.py"

          password = os.environ.get("ZIP_PASSWORD", "")

          if not password:
              raise RuntimeError("ZIP PASSWORD SECRET EMPTY!")

          with pyzipper.AESZipFile(archive, "r") as z:

              matches = [
                  name for name in z.namelist()
                  if Path(name).name.lower() == output.lower()
              ]

              if len(matches) != 1:
                  raise FileNotFoundError(
                      "Movie_ott_Bd.py missing or duplicated!"
                  )

              data = z.read(
                  matches[0],
                  pwd=password.encode("utf-8")
              )

          if not data:
              raise RuntimeError("Empty Python source!")

          Path(output).write_bytes(data)

          print("ZIP EXTRACTION SUCCESSFUL!")
          PY

      - name: Validate Python Source
        run: |
          python -m py_compile Movie_ott_Bd.py

      - name: Run Movie Generator
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u Movie_ott_Bd.py

      - name: Validate Output
        run: |
          test -s Playlist/Movie_ott_Bd.m3u8
          test -s Playlist/Movie_ott_Bd_Report.txt

          grep -q "^#EXTM3U" Playlist/Movie_ott_Bd.m3u8

          echo "PLAYLIST VALIDATED!"

          ls -lh Playlist/

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Playlist/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto Update Movie OTT BD"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f Movie_ott_Bd.py

      - name: Final Summary
        if: always()
        run: |
          echo "## MOVIE OTT BD" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workers: 20" >> "$GITHUB_STEP_SUMMARY"
          echo "Schedule: Every hour" >> "$GITHUB_STEP_SUMMARY"
